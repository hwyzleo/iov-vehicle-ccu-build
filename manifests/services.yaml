# CCU Build Service Manifest
# Built-in minimal example services for BUILD v0.1-draft self-verification
# (CR-001 实施阶段 1：仅在 ccu-build 中完成 schema、内置示例、staging、
# manifest 与包自验证，不依赖修改真实服务)。
#
# CCU-BUILD-DSN-CR-002：接入真实 CCU framework（../iov-vehicle-ccu-framework）
# 作为首个公共 library 依赖，并以内置 framework-consumer 自验证下游
# installed-package 消费契约。framework 的精确 component/package 名由
# CCU-FW install/export CR（CCU-FW-DSN-CR-006）固化。
#
# 依赖字段使用显式 service_dependencies / target_dependencies 分离；
# install_components 使用 {name, staging} 形式。

services:
  ccu-hello-lib:
    description: "Minimal C++ shared library for CCU BUILD v0.1-draft self-verification"
    repository: examples/minimal
    kind: library
    build:
      targets:
        - ccu-hello-lib
      service_dependencies: []
      target_dependencies: []
      preset: ccu-dev-release
      install_components:
        - name: ccu-hello-lib-runtime
          staging: rootfs
    runtime:
      config_paths: []
      persistent_paths: []

  ccu-hello-cli:
    description: "Minimal C++ executable consuming ccu-hello-lib"
    repository: examples/minimal
    build:
      targets:
        - ccu-hello-cli
      service_dependencies:
        - ccu-hello-lib
      target_dependencies: []
      preset: ccu-dev-release
      install_components:
        - name: ccu-hello-cli-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - ccu-hello.service
      after: []
      health_check: tests/smoke/hello-health.sh
      smoke_test: tests/smoke/hello-ipc.sh
      config_paths:
        - /etc/ccu/common.yaml
        - /etc/ccu/conf.d/ccu-hello-cli.yaml
      config_validation:
        schema: config/schema/ccu-hello-cli.schema.yaml
        target_path: /etc/ccu/conf.d/ccu-hello-cli.yaml
        default_source: config/ccu-hello-cli.default.yaml
      persistent_paths:
        - /var/lib/ccu/hello
      required_devices: []
      capabilities: []

  # CCU-BUILD-DSN-CR-002 §1: framework 作为首个真实公共 library 依赖接入。
  # 五个独立 target、sdk/rootfs install components、无 systemd unit（library）。
  # target_dependencies 指向 dependency-lock 中的 yaml-cpp（受控 TARGET 依赖），
  # 在 framework configure 前由 BUILD 校验已 staging 到 CCU_DEP_STAGING。
  framework:
    description: "CCU framework five-component public SDK library (CCU-BUILD-DSN-CR-002)"
    source_dir: ../iov-vehicle-ccu-framework
    revision: a2559e068cbc4f74c677ff16c9e55be5dd4679a2
    kind: library
    build:
      targets:
        - ccu-framework-config
        - ccu-framework-log
        - ccu-framework-store
        - ccu-framework-hash
        - ccu-framework-someip
      service_dependencies: []
      target_dependencies:
        - yaml-cpp
      # 生产 SOME/IP 后端（vsomeip3）：TARGET readiness 已由 vsomeip3 3.4.10
      # 受控 sysroot 满足；默认 OFF 的 FakeSomeIpBackend 无网络，会导致服务间
      # SOME/IP 全部不可达（DIAG unavailable），必须显式开启。
      cmake_cache_variables:
        CCU_FW_SOMEIP_VSOMEIP: "ON"
      preset: ccu-dev-release
      install_components:
        - name: ccu-framework-sdk
          staging: sdk
        - name: ccu-framework-runtime
          staging: rootfs
    runtime:
      config_paths: []
      persistent_paths: []

  # CCU-BUILD-DSN-CR-002 §5: 内置 installed-package consumer 自验证下游消费契约。
  # 仅通过 find_package(CCUFramework) + 导出 targets 消费 framework，不引用
  # framework 源码/build tree。复用 framework 的 TARGET 依赖 yaml-cpp。
  framework-consumer:
    description: "CCU framework installed-package consumer self-verification (CCU-BUILD-DSN-CR-002)"
    repository: examples/framework-consumer
    kind: daemon
    build:
      targets:
        - ccu-framework-consumer
      service_dependencies:
        - framework
      target_dependencies:
        - yaml-cpp
      preset: ccu-dev-release
      install_components:
        - name: ccu-framework-consumer-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - ccu-framework-consumer.service
      after: []
      health_check: tests/smoke/framework-consumer-health.sh
      smoke_test: tests/smoke/framework-consumer-ipc.sh
      config_paths:
        - /etc/ccu/common.yaml
        - /etc/ccu/conf.d/framework-consumer.yaml
      config_validation:
        schema: config/schema/framework-consumer.schema.yaml
        target_path: /etc/ccu/conf.d/framework-consumer.yaml
        default_source: config/framework-consumer.default.yaml
      persistent_paths:
        - /var/lib/ccu/framework-consumer
      required_devices: []
      capabilities: []

  # CCU-SEC 真实服务接入（CCU-SEC-DSN-CR-005 §3.2/§6.1）。
  # 固定 commit；服务只依赖 framework，不反向依赖 consumer。
  # ccu-sec-runtime 精确安装：usr/bin/ccu_sec、usr/lib/systemd/system/ccu-sec.service、
  # etc/ccu/conf.d/sec.yaml、usr/share/ccu-sec/schema/sec.schema.yaml。
  # SEC 的 baseline unit 不声明 consumer 顺序；平台 vsomeip 环境由 BUILD 拥有的
  # drop-in/共享 JSON 交付（CCU-BUILD-DSN-CR-004 §5）。
  ccu-sec:
    description: "CCU security daemon (CCU-SEC-DSN-CR-005)"
    source_dir: ../iov-vehicle-ccu-sec
    revision: a88bac2173fba1a23e033757bb870c25516d86dc
    kind: daemon
    build:
      targets:
        - ccu_sec
      service_dependencies:
        - framework
      # 真实服务 TARGET 依赖（nlohmann-json/vsomeip3/Boost/OpenSSL）由后续
      # TARGET readiness CR 关闭并锁定；本 CR 不虚构 lock 条目。
      target_dependencies:
        - yaml-cpp
      preset: ccu-dev-release
      install_components:
        - name: ccu-sec-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - ccu-sec.service
      after:
        - network.target
      smoke_test: tests/smoke/smoke-sec.sh
      config_paths:
        - /etc/ccu/common.yaml
        - /etc/ccu/conf.d/sec.yaml
      config_validation:
        schema: config/schema/sec.schema.yaml
        target_path: /etc/ccu/conf.d/sec.yaml
        default_source: config/sec.default.yaml
      persistent_paths:
        - /var/lib/ccu/sec
      platform_assets:
        - source: usr/lib/systemd/system/ccu-sec.service.d/vsomeip.conf
          target: /usr/lib/systemd/system/ccu-sec.service.d/vsomeip.conf
          required: true
          validation: vsomeip-dropin
        - source: etc/ccu/someip/vsomeip.json
          target: /etc/ccu/someip/vsomeip.json
          required: true
          validation: vsomeip-json
      required_devices: []
      capabilities: []

  # CCU-DIAG 真实服务接入（CCU-DIAG-DSN-CR-009 §3.2/§6.1，seed 见 CR-010 §12.1）。
  # 固定 commit；DIAG 依赖 Framework SDK 并表达 DIAG→SEC 运行拓扑。
  # revision 追到 CR-012：ecu_inventory 事实拆出 softwarePartNumber（DID 0xF188）
  # 独立字段并新增 serialNumber（DID 0xF18C）读回（66d2e5b / 880ad37）。
  # ccu-diag-runtime 精确安装 5 个文件：usr/bin/ccu_diag、
  # usr/lib/systemd/system/ccu-diag.service、etc/ccu/conf.d/diag.yaml、
  # usr/share/ccu-diag/schema/diag.schema.yaml、
  # usr/share/ccu-diag/ecu-inventory.seed.json（mode 0644）。
  # seed 是 ccu-diag 拥有的只读 release-managed 部署资产（deploy_policy=replace，
  # 由 config-deployment.yaml 精确授权），不是 BUILD-owned 或 platform asset；
  # 设备实例状态 /var/lib/ccu/diag/** 保持 preserve，不进入发布包。
  # SEC 不可用时保持既有业务降级语义（After=/Wants=，不使用 Requires=）。
  ccu-diag:
    description: "CCU diagnostic gateway daemon (CCU-DIAG-DSN-CR-009/CR-010)"
    source_dir: ../iov-vehicle-ccu-diag
    revision: 66d2e5b7b7a32dcbeb67419ee0264a3ba404b72e
    kind: daemon
    build:
      targets:
        - ccu_diag
      service_dependencies:
        - framework
        - ccu-sec
      target_dependencies:
        - yaml-cpp
      preset: ccu-dev-release
      install_components:
        - name: ccu-diag-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - ccu-diag.service
      after:
        - network.target
        - ccu-sec.service
      smoke_test: tests/smoke/smoke-diag.sh
      config_paths:
        - /etc/ccu/common.yaml
        - /etc/ccu/conf.d/diag.yaml
      config_validation:
        schema: config/schema/diag.schema.yaml
        target_path: /etc/ccu/conf.d/diag.yaml
        default_source: config/diag.default.yaml
      persistent_paths:
        - /var/lib/ccu/diag
      platform_assets:
        - source: usr/lib/systemd/system/ccu-diag.service.d/vsomeip.conf
          target: /usr/lib/systemd/system/ccu-diag.service.d/vsomeip.conf
          required: true
          validation: vsomeip-dropin
        - source: etc/ccu/someip/vsomeip.json
          target: /etc/ccu/someip/vsomeip.json
          required: true
          validation: vsomeip-json
      required_devices: []
      capabilities: []

  # CCU-FOTA 真实服务接入（CCU-FOTA-DSN-CR-008 §12）。
  # install component ccu-fota-runtime 由服务仓库 install() 声明：
  #   /usr/bin/ccu-fota、/usr/lib/systemd/system/ccu-fota.service、
  #   /etc/ccu/conf.d/fota.yaml、/usr/share/ccu-fota/schema/fota.schema.yaml。
  # 平台相关的 vsomeip drop-in/共享 JSON 属于 BUILD 拥有的平台资产
  # （CCU-BUILD-DSN-CR-004 §5），不在服务 install 内。
  # FOTA 表达 FOTA→DIAG 运行拓扑（After=/Wants=，不使用 Requires=）。
  # revision 追到 CR-012/CR-013/CR-015：清单身份决策器（FULL/DIGEST）、安装结果
  # 登记（record_installed_versions）、DIAG payload v2 独立软件件号、
  # NON_PRODUCTION Mock 联调机制合入（945d4c2 / be7191e / 9d5ad0f / 302b56f），
  # 并追到 b556f91（TBOX 响应帧解析与可定位失败日志）；
  # 5cb7b51：NON_PRODUCTION Mock 构建支持显式 -DCCU_FOTA_MOCK_INSTALL=ON 安装（联调）。
  # d65855f：空 package_list / download_allowed=false 时 fail-closed，
  # WaitingWindow 与安装登记不可用自救（回退检测并保持清单上报），
  # step 失败落日志，登记 method_id 由 0 改为 5（DIAG 0x0005）。
  ccu-fota:
    description: "CCU FOTA daemon + orchestrator (CCU-FOTA-DSN-CR-008 §12)"
    source_dir: ../iov-vehicle-ccu-fota
    revision: 5cb7b5118f141296eedfd06b438c5f2d75b3db9a
    kind: daemon
    build:
      targets:
        - ccu-fota
      service_dependencies:
        - framework
        - ccu-diag
      target_dependencies:
        - yaml-cpp
      # ccu-dev 联调（CCU-FOTA-DSN-CR-015 §D1）：NON_PRODUCTION Mock 构建。
      # 下载/校验/刷写以 Mock 成功代理（MockPackageDownloader/MockInstallExecutor/
      # MockVehicleConditionProvider），但 SOME/IP 与车云链路、清单上报、各阶段
      # 上报（StageResultReport/ExecutionEvent/FinalResultReport）均为真实实现。
      # 量产平台必须移除这两项（保持 PRODUCTION 构建）。
      cmake_cache_variables:
        FOTA_ENABLE_TEST_DOUBLES: "ON"
        CCU_FOTA_MOCK_INSTALL: "ON"
      preset: ccu-dev-release
      install_components:
        - name: ccu-fota-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - ccu-fota.service
      after:
        - network.target
        - ccu-diag.service
      smoke_test: tests/smoke/smoke-fota.sh
      config_paths:
        - /etc/ccu/common.yaml
        - /etc/ccu/conf.d/fota.yaml
      config_validation:
        schema: config/schema/fota.schema.yaml
        target_path: /etc/ccu/conf.d/fota.yaml
        default_source: config/fota.default.yaml
      persistent_paths:
        - /var/lib/ccu/fota
      platform_assets:
        - source: usr/lib/systemd/system/ccu-fota.service.d/vsomeip.conf
          target: /usr/lib/systemd/system/ccu-fota.service.d/vsomeip.conf
          required: true
          validation: vsomeip-dropin
        - source: etc/ccu/someip/vsomeip.json
          target: /etc/ccu/someip/vsomeip.json
          required: true
          validation: vsomeip-json
      required_devices: []
      capabilities: []
