# CCU Build Config Deployment Manifest
# Declares deploy policy for /etc/ccu/** files per platform (设计 §9.4).
#
# CR: CCU-BUILD-DSN-CR-003 §9.4
#
# deploy_policy: replace|preserve|create_if_missing
#   - release-managed 配置 MAY 使用 replace；
#   - device-managed/provisioning 内容必须使用 preserve；
#   - 未匹配策略的路径默认 preserve（由 BUILD 兜底保证）。
# 精确路径优先于 glob；同优先级多规则命中且策略不一致时失败。
# device-managed 文件不得 replace。
version: 1
platforms:
  ccu-dev:
    files:
      - path: /etc/ccu/common.yaml
        owner: build
        category: release-managed
        deploy_policy: replace
      - path_glob: /etc/ccu/conf.d/*.yaml
        owner: service
        category: release-managed
        deploy_policy: replace
      # CCU-BUILD-DSN-CR-005 §4: DIAG deployment seed is a service-owned
      # read-only release-managed asset. It is installed/replaced together
      # with ccu_diag, its unit and diag.yaml, and never inlined by BUILD.
      # /var/lib/ccu/diag/** (instance state) stays preserve and out of the
      # payload, so it never matches this rule.
      - path: /usr/share/ccu-diag/ecu-inventory.seed.json
        owner: service
        category: release-managed
        deploy_policy: replace
      # CCU-BUILD-DSN-CR-004 §6: BUILD-owned platform runtime assets.
      # The ReleaseSetAssembler is their only installer; the generic config
      # overlay skips paths it already claimed.
      - path_glob: /usr/lib/systemd/system/*.service.d/vsomeip.conf
        owner: build
        category: release-managed
        deploy_policy: replace
      # ccu-dev 联调：CCU-FOTA NON_PRODUCTION Mock 场景脚本（BUILD-owned 平台资产，
      # 与 fota.yaml 的 fota.mock.scenario_path 精确对应；全阶段成功、无故障）。
      - path: /usr/share/ccu-fota/mock/scenario.json
        owner: build
        category: release-managed
        deploy_policy: replace
      - path: /etc/ccu/someip/vsomeip.json
        owner: build
        category: release-managed
        deploy_policy: replace
      - path_glob: /etc/ccu/credentials/**
        owner: provisioning
        category: device-managed
        deploy_policy: preserve
