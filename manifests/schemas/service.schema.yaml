# JSON Schema (Draft-07) for CCU Build Service Manifest
# Validates manifests/services.yaml
#
# CR: CCU-BUILD-DSN-CR-001 §5 项目与编排模型
#
# 字段策略：
#   - build.targets[] (复数) 为规范形式；旧版 build.target (单数) 兼容接受。
#     两种形式不可同时声明。
#   - build.install_components[] 为 {name, staging} 对象数组。
#   - build.service_dependencies[] 和 build.target_dependencies[] 为显式依赖字段。
#   - kind 可选；省略时默认 "daemon"。
$schema: "http://json-schema.org/draft-07/schema#"
title: CCU Build Service Manifest
type: object
required:
  - services
properties:
  services:
    type: object
    minProperties: 1
    additionalProperties: false
    patternProperties:
      "^[a-z][a-z0-9-]*$":
        type: object
        required:
          - build
        additionalProperties: false
        anyOf:
          - required:
              - repository
          - required:
              - source_dir
        properties:
          repository:
            type: string
            minLength: 1
          revision:
            type: string
          source_dir:
            type: string
          description:
            type: string
          kind:
            type: string
            enum:
              - library
              - daemon
              - service
          build:
            type: object
            required:
              - preset
            additionalProperties: false
            properties:
              preset:
                type: string
                minLength: 1
              target:
                type: string
                minLength: 1
              targets:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
              install_component:
                type: string
                minLength: 1
              install_components:
                type: array
                items:
                  type: object
                  required:
                    - name
                    - staging
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 1
                    staging:
                      type: string
                      enum:
                        - sdk
                        - rootfs
              service_dependencies:
                type: array
                items:
                  type: string
                  minLength: 1
              target_dependencies:
                type: array
                items:
                  type: string
                  minLength: 1
              dependencies:
                type: array
                items:
                  type: string
                  minLength: 1
              cmake_cache_variables:
                type: object
                additionalProperties:
                  type: string
            allOf:
              # target / targets 二选一
              - oneOf:
                  - required:
                      - target
                    not:
                      required:
                        - targets
                  - required:
                      - targets
                    not:
                      required:
                        - target
              # install_component / install_components 互斥
              - not:
                  required:
                    - install_component
                    - install_components
              # 旧版 dependencies 不可与显式依赖字段共存
              - not:
                  required:
                    - dependencies
                    - service_dependencies
              - not:
                  required:
                    - dependencies
                    - target_dependencies
          runtime:
            type: object
            additionalProperties: false
            properties:
              systemd_units:
                type: array
                items:
                  type: string
                  minLength: 1
              after:
                type: array
                items:
                  type: string
                  minLength: 1
              health_check:
                type: string
              smoke_test:
                type: string
              config_paths:
                type: array
                items:
                  type: string
              config_validation:
                type: object
                additionalProperties: false
                properties:
                  schema:
                    type: string
                  target_path:
                    type: string
                  default_source:
                    type: string
              persistent_paths:
                type: array
                items:
                  type: string
              # CCU-BUILD-DSN-CR-004 §3.2: BUILD-owned platform runtime assets
              # delivered only when the declaring service is in the selected
              # release-set closure. source/target must correspond one-to-one;
              # validation is an explicit enum (never inferred from extension).
              platform_assets:
                type: array
                items:
                  type: object
                  required:
                    - source
                    - target
                    - required
                    - validation
                  additionalProperties: false
                  properties:
                    source:
                      type: string
                      minLength: 1
                    target:
                      type: string
                      minLength: 1
                    required:
                      type: boolean
                    validation:
                      type: string
                      enum:
                        - vsomeip-dropin
                        - vsomeip-json
              required_devices:
                type: array
                items:
                  type: string
              capabilities:
                type: array
                items:
                  type: string
