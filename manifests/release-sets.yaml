# CCU Build Release Set Manifest
# Built-in release sets for BUILD v0.1-draft self-verification.

release_sets:
  ccu-dev-minimal:
    description: "Minimal CCU release set for BUILD v0.1-draft self-verification (CR-001)"
    platform: ccu-dev
    profile: release
    services:
      - ccu-hello-lib
      - ccu-hello-cli

  # CCU-BUILD-DSN-CR-002: framework 接入 + installed-package consumer 自验证。
  # HOST 自验证通过编排器注入的等价 CMAKE_PREFIX_PATH 完成 find_package/编译/链接；
  # TARGET 构建通过 toolchain 注入查找根。
  ccu-dev-framework:
    description: "CCU framework + installed-package consumer self-verification (CR-002)"
    platform: ccu-dev
    profile: release
    services:
      - framework
      - framework-consumer

  # CCU-BUILD-DSN-CR-004 §3.3: 真实服务发布集合。
  # 即使调用方只指定部分服务，assembler 也使用 build_order() 的完整闭包；
  # 聚合 target 按拓扑序为 ccu-sec.service ccu-diag.service ccu-fota.service
  # （framework 为 library，无 unit）。
  ccu-dev-fota:
    description: "CCU framework + ccu-sec + ccu-diag + ccu-fota release set (CCU-BUILD-DSN-CR-004)"
    platform: ccu-dev
    profile: release
    services:
      - framework
      - ccu-sec
      - ccu-diag
      - ccu-fota
