# ccu-sec.service platform drop-in: SOME/IP runtime environment
# (CCU-BUILD-DSN-CR-004 §5.1; REQ-003)
#
# BUILD owns this platform runtime asset. It only carries the platform
# environment needed to join the controlled vsomeip routing configuration.
# ExecStart, SOME/IP Service/Instance/Method IDs, security policy and
# business timeouts are owned by the service and MUST NOT be overridden here.
[Service]
Environment=VSOMEIP_CONFIGURATION=/etc/ccu/someip/vsomeip.json
Environment=VSOMEIP_APPLICATION_NAME=ccu-sec
