# ccu-diag.service platform drop-in: SOME/IP runtime environment
# (CCU-BUILD-DSN-CR-004 §5.1; REQ-003)
#
# BUILD owns this platform runtime asset. It only carries the platform
# environment needed to join the controlled vsomeip routing configuration.
# ExecStart, SOME/IP Service/Instance/Method IDs, business timeouts,
# diagnostic and security semantics are owned by the service and MUST NOT be
# overridden here.
#
# Note (CCU-BUILD-DSN-CR-004 §5.1): the vsomeip-dropin validator authorizes
# exactly these two Environment= directives. Any other directive (e.g.
# PrivateTmp=, ExecStart=) is rejected; such a device/platform hardening
# decision needs a platform-manifest/policy decision, not a silent drop-in
# extension.
[Service]
Environment=VSOMEIP_CONFIGURATION=/etc/ccu/someip/vsomeip.json
Environment=VSOMEIP_APPLICATION_NAME=ccu-diag
